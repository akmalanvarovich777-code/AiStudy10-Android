name: AiStudy10 Android 10-Panel APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 37
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare AiStudy10 v2.17 Android project
        run: |
          mkdir -p /tmp/aistudy10-v3
          unzip -q AiStudy10_Android_10_Panel_v3_Source.zip -d /tmp/aistudy10-v3
          cp -a /tmp/aistudy10-v3/gradle.properties /tmp/aistudy10-v3/settings.gradle /tmp/aistudy10-v3/build.gradle .
          sed -i "s/version '8.7.3'/version '9.1.1'/" build.gradle
          rm -rf app
          cp -a /tmp/aistudy10-v3/app .
          sed -i 's/compileSdk 35/compileSdk 37/' app/build.gradle
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AiStudy10-Android10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
