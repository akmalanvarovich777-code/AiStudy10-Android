plugins { id 'com.android.application' }

android {
    namespace 'uz.akmal.aistudy10'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.akmal.aistudy10'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
