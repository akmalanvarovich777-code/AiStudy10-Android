plugins { id 'com.android.application' }

android {
    namespace 'uz.akmal.aistudy10'
    compileSdk 36
    defaultConfig {
        applicationId 'uz.akmal.aistudy10'
        minSdk 28
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        versionCode 2183
        versionName '2.18.3-android-arm64'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    packaging { resources { excludes += ['META-INF/LICENSE*','META-INF/NOTICE*'] } }
}
dependencies {
    implementation 'org.mozilla.geckoview:geckoview:152.0.20260713164047'
}
